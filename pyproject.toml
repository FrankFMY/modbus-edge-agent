[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "modbus-edge-agent"
version = "0.1.0"
description = "Read-only Modbus RTU polling, semantic register decoding, durable buffering and MQTT publishing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Artem Prianishnikov", email = "Pryanishnikovartem@gmail.com" }
]
keywords = ["modbus", "mqtt", "rs485", "edge", "telemetry", "industrial-iot"]
dependencies = [
  "paho-mqtt>=2.1,<3",
  "pymodbus>=3.8.6,<4",
  "pyserial>=3.5,<4"
]

[project.urls]
Homepage = "https://frankfmy.com"
Repository = "https://github.com/FrankFMY/modbus-edge-agent"
Issues = "https://github.com/FrankFMY/modbus-edge-agent/issues"

[project.scripts]
modbus-edge-agent = "modbus_edge_agent.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modbus_edge_agent"]
